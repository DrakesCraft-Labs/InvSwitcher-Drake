<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" width="920" height="240" role="img" aria-label="InvSwitcher Drake Banner">
  <defs>
    <linearGradient id="bFondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050B14"/>
      <stop offset="50%" stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#141E33"/>
    </linearGradient>
    <linearGradient id="invG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <radialGradient id="bHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Fondo y Resplandor -->
  <rect width="920" height="240" rx="16" fill="url(#bFondo)"/>
  <rect width="920" height="240" rx="16" fill="url(#bHalo)"/>
  <rect x="2" y="2" width="916" height="236" rx="14" fill="none" stroke="url(#invG)" stroke-width="2" opacity="0.45"/>
  
  <!-- Icono Central: Mochila / Slots de Inventario Segregados -->
  <g transform="translate(460,65)">
    <!-- Mochila / Caja Central -->
    <rect x="-24" y="-18" width="48" height="36" rx="6" fill="#0F172A" stroke="url(#invG)" stroke-width="2.5"/>
    <rect x="-10" y="-24" width="20" height="8" rx="3" fill="none" stroke="#00E5FF" stroke-width="2"/>
    <!-- Slots de Inventario -->
    <rect x="-18" y="-10" width="10" height="10" rx="2" fill="#1E293B" stroke="#3B82F6" stroke-width="1"/>
    <rect x="-5" y="-10" width="10" height="10" rx="2" fill="#1E293B" stroke="#8B5CF6" stroke-width="1"/>
    <rect x="8" y="-10" width="10" height="10" rx="2" fill="#1E293B" stroke="#00E5FF" stroke-width="1"/>
    <rect x="-18" y="3" width="10" height="10" rx="2" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
    <rect x="-5" y="3" width="10" height="10" rx="2" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
    <rect x="8" y="3" width="10" height="10" rx="2" fill="#1E293B" stroke="#EC4899" stroke-width="1"/>
  </g>
  
  <!-- Título Principal -->
  <text x="460" y="148" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#F8FAFC" letter-spacing="3">
    INVSWITCHER · DRAKE EDITION
  </text>
  
  <!-- Subtítulo -->
  <text x="460" y="178" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" fill="#00E5FF" letter-spacing="3" opacity="0.95">
    5-MODALITY INVENTORY, ENDERCHEST &amp; XP ISOLATION ENGINE
  </text>
  
  <!-- Badges Inferiores -->
  <g transform="translate(460, 208)">
    <rect x="-245" y="-12" width="110" height="20" rx="4" fill="#0F172A" stroke="#3B82F6" stroke-width="1"/>
    <text x="-190" y="2" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#E2E8F0">DRAKES LABS</text>
    
    <rect x="-120" y="-12" width="110" height="20" rx="4" fill="#0F172A" stroke="#8B5CF6" stroke-width="1"/>
    <text x="-65" y="2" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#E2E8F0">PAPER 1.21.11</text>
    
    <rect x="5" y="-12" width="115" height="20" rx="4" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
    <text x="62" y="2" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#A7F3D0">ZERO-LEAKAGE</text>
    
    <rect x="135" y="-12" width="115" height="20" rx="4" fill="#0F172A" stroke="#00E5FF" stroke-width="1"/>
    <text x="192" y="2" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#E2E8F0">5 MODALIDADES</text>
  </g>
